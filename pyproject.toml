[tool.poetry]
# update this to the name of the project!
name = "basic_template"
version = "0.1.0"
readme = "README.md"

# set this to true if this is a package which will be built and imported by other projects
# for this to work, the name of the project needs to match the directory which contains the package.
package-mode = false

[tool.poetry.dependencies]
# DO NOT CHANGE THIS MANUALLY
# Use poetry add {package}
# for gitlab packages in the package repository add `--source gitlab`
# any python version after 3.10
python = "^3.10,<3.12"
pandas = "^2.2.3"
keyring = "^25.5.0"
snowflake-connector-python = "^3.12.4"
credentials-manager = {version = "^1.2.2", source = "gitlab"}

[tool.poetry.group.test]
# define the test group and set as optional
optional = true

[tool.poetry.group.test.dependencies]
# any test dependencies
# DO NOT CHANGE THIS MANUALLY
# Use poetry add {package} --group test
keyrings-alt = "^5.0.2"  # this is for any keyring tests which need to run on GitLab
coverage = "^7.6.4"

[tool.poetry.group.checks]
# define the checks group and set as optional
optional = true

[tool.poetry.group.checks.dependencies]
# dependencies for the checks which happen in gitlab
# DO NOT CHANGE THIS MANUALLY
# Use poetry add {package} --group checks
ruff = "^0.7.2"
pre-commit = "^4.0.1"
black = "^24.10.0"
mypy = "^1.13.0"
sqlfluff = "^3.3.0"

[tool.poetry.group.build]
# define the checks group and set as optional
optional = true

[tool.poetry.group.build.dependencies]
keyrings-alt = "^5.0.2"

[[tool.poetry.source]]
# data-and-insights group repository
name = "gitlab"
url = "https://git.clever-touch.com/api/v4/groups/1142/-/packages/pypi/simple"
priority = "supplemental"

[tool.black]
line-length = 100

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default and more checks that we have selected
lint.select = ["E", "F", "N","D","PD","RUF","PL","NPY","PTH","RET","SIM"]
lint.ignore = ["D213","D203","E501","PD901", "PLC1901"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
lint.unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
lint.per-file-ignores = {"__init__.py" = ["D"]}

# Same as Black.
line-length = 100

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.mypy]
warn_redundant_casts = true

disallow_incomplete_defs = true
disallow_untyped_defs = true

warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

ignore_missing_imports = true

[tool.sqlfluff.core]
templater = "jinja"
dialect = "snowflake"

max_line_length = 120
large_file_skip_byte_limit = 0
processes = -1

[tool.sqlfluff.indentation]
# While implicit indents are not enabled by default. Many of the
# SQLFluff maintainers do use them in their projects.
allow_implicit_indents = true

[tool.sqlfluff.rules.aliasing.length]
min_alias_length = 3

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.types]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.convention.not_equal]
# Default to preferring the "c_style" (i.e. `!=`)
preferred_not_equal_style = "c_style"

[tool.sqlfluff.layout.type.alias_expression]
# We want non-default spacing _before_ the alias expressions.
spacing_before = "align"
# We want to align them within the next outer select clause.
# This means for example that alias expressions within the FROM
# or JOIN clause would _not_ be aligned with them.
align_within = "select_clause"
# The point at which to stop searching outward for siblings, which
# in this example would likely be the boundary of a CTE. Stopping
# when we hit brackets is usually a good rule of thumb for this
# configuration.
align_scope = "bracketed"
