# Snowflake Dev -> Prod Deployment
snowflake_deploy:
  stage: build_and_deploy
  extends: .python_template
  image: 'python:3.11'
  script:
    - poetry install --with build
    - python gitlab_prep/set_keyring_from_env.py
    - python gitlab_prep/snowflake_deploy.py
  rules:
   - if: '$CI_COMMIT_BRANCH == "main"'
   - changes:
       - snowflake_views/**/*  # only run when there are changes in the snowflake_views folder
